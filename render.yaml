services:
  # ==================================
  # FRONTEND (React / Vite)
  # ==================================
  - type: web
    name: price-intelligence-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.20.0
      - key: VITE_API_URL
        value: https://price-intelligence-backend.onrender.com

  # ==================================
  # BACKEND (Python / FastAPI)
  # ==================================
  - type: web
    name: price-intelligence-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FRONTEND_URL
        value: https://price-intelligence-frontend-uyvg.onrender.com
      # Add placeholders for Secrets that you will populate manually in the Render dashboard
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ALLOW_DOMAIN
        value: bici.cc
      - key: MERCHANT_ID
        sync: false
      # Note: For GOOGLE_APPLICATION_CREDENTIALS and MERCHANT_APPLICATION_CREDENTIALS,
      # you will use Render "Secret Files", not env vars.

  # ==================================
  # NIGHTLY COMPETITOR PRICE SCRAPE
  # ==================================
  - type: cron
    name: price-intelligence-scraper
    env: python
    plan: starter
    rootDir: backend
    schedule: "0 9 * * *"  # 09:00 UTC ≈ overnight in Mountain Time
    buildCommand: pip install -r requirements.txt
    startCommand: python run_scrape.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # GOOGLE_APPLICATION_CREDENTIALS via Render "Secret Files" (same as backend)
      # DataForSEO credentials for the serp_api connector (primeauvelo.com etc.)
      - key: DATAFORSEO_LOGIN
        sync: false
      - key: DATAFORSEO_PASSWORD
        sync: false
